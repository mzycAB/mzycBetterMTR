plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// ★ archives_base_name 只是「声明」⇒ 必须显式应用，产物才会叫 mzycBetterMTR-<ver>.jar
base {
    archivesName = project.archives_base_name
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}

mixin {
    add sourceSets.main, 'smooth_escalator.refmap.json'
    config 'smooth_escalator.mixins.json'
    // 【1.42】MTR 直梯（Lift）相关的 @Pseudo mixin：独立一份配置，
    //   required=false + plugin 判据，MTR 不在时整份配置跳过，绝不报错。
    config 'smoothlift.mtr.mixins.json'
    // 【1.50】屏蔽门（PSD / APG）门值采集的 @Pseudo mixin：同样独立一份配置，
    //   由 PsdDoorMixinPlugin 按目标类是否存在单独门禁（安全跳过）。
    config 'smoothlift.psd.mixins.json'
    // 【1.27c / 1.29 移植】光照修复四件套(AO 采样 / AO 暂存 / 平顶光照 / 闸机音量):
    //   vanilla 类的常规 client mixin,独立一份配置。
    config 'smoothlift.client.mixins.json'
    // 【1.27c / 1.29 移植】Sodium 光照修复（@Pseudo，Jelly / caffeinemc 两种包名各一份，
    //   未装 Sodium 时整份配置静默跳过）：独立一份配置。
    config 'smoothlift.sodium.mixins.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.forge_version}"
    compileOnly "org.spongepowered:mixin:${project.mixin_version}"
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    // 源码为 UTF-8（含中文注释与字符串字面量），必须显式指定，
    // 否则 javac 会用系统默认编码(中文 Windows 上是 GBK)读取，
    // 导致字面量乱码 + "编码 GBK 的不可映射字符" 报错。
    options.encoding = 'UTF-8'
    options.compilerArgs += [
            '-AoutRefMapFile=' + project.layout.buildDirectory.file('resources/main/smooth_escalator.refmap.json').get().asFile.absolutePath,
            '-AdefaultObfuscationEnv=searge'
    ]
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'smooth-lift',
            'Specification-Vendor'  : 'mzycAB',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'SmoothLift',
            'Implementation-Version': project.version,
            'Implementation-Vendor' : 'mzycAB',
            'MixinConfigs'          : 'smooth_escalator.mixins.json,smoothlift.client.mixins.json,smoothlift.mtr.mixins.json,smoothlift.psd.mixins.json,smoothlift.sodium.mixins.json'
        ])
    }
}
