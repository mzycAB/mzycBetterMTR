# 【1.7】自定义扶梯声音：客户端播放器需要把玩家选择的 OGG 音频直接注入声音引擎，
# 因此要访问 SoundManager -> SoundEngine -> SoundBufferLibrary 这条链上的三个私有字段。
# 本项目用 official（mojmap）映射开发、AT 在 srg 命名空间生效，故这里写 srg 名：
#   Minecraft.getSoundManager()（公开）-> SoundManager.soundEngine        (f_120349_)
#   -> SoundEngine.soundBuffers                                          (f_120222_)
#   -> SoundBufferLibrary.cache（缓存 Map）                              (f_120190_)
# 注入后 SoundEngine.play() 经 getCompleteBuffer(computeIfAbsent) 命中缓存，
# 直接用本地字节音频播放，不再读资源包。

# instanceToChannel（SoundInstance -> ChannelHandle，f_120226_）用于播放成功后对底层
# Channel 调 setLooping(true)：静态 Sound 默认播完一遍就停，扶梯声音需要循环。
# ---------------------------------------------------------------------------
public net.minecraft.client.sounds.SoundManager f_120349_ # soundEngine
public net.minecraft.client.sounds.SoundEngine f_120222_ # soundBuffers
public net.minecraft.client.sounds.SoundBufferLibrary f_120190_ # cache
public net.minecraft.client.sounds.SoundEngine f_120226_ # instanceToChannel

# ---------------------------------------------------------------------------
# 【1.12】音量放大到 >100%（最大 10×）需要拿到 OpenAL 的 source 句柄：
# Channel.source（private final int，f_83642_）就是 alGenSources 出来的 AL source id。

# 为什么要它：OpenAL 会把「源增益」夹到 AL_MAX_GAIN，而 AL_MAX_GAIN 默认 = 1.0。
# 也就是说，即使 Minecraft 侧（SoundEngine.calculateVolume）已经不夹了、
# Channel.setVolume(2.0) 也照发了，OpenAL 仍会把有效增益压回 1.0 —— 表现就是
# 「音量调到 100 以上完全没变化」。把 AL_MAX_GAIN 抬到 10 才能真正放大
# （实测：OpenAL Soft 1.23 支持 AL_SOFT_gain_clamp_ex，AL_GAIN_LIMIT_SOFT = 1000）。

# 注：com.mojang.blaze3d.audio.Channel 自 1.17 起已并入 Minecraft 客户端 jar，
# 因此这里也能用 AT 打开其私有字段。
# ---------------------------------------------------------------------------
public com.mojang.blaze3d.audio.Channel f_83642_ # source

