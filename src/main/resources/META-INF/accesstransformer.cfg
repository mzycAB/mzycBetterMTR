# 另注：AT 解析器不接受「只有一个 # 的行」，段落分隔也必须带文字。
# Fabric 侧 BeforeBake 回调拿到的就是 BlockModel 本身、字段是包内可见/公开，
# 无需 AT；Forge 走 mixin 挂 ModelBakery.getModel 的返回处，才需要这一条。
# ---------------------------------------------------------------------------
public net.minecraft.client.renderer.block.model.BlockModel f_111417_ # textureMap

